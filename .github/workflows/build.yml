name: build-esp32s3-linux

on:
  workflow_dispatch:
  push:
    branches: ["*"]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (list from upstream esp32-linux-build README)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake bash bc bison build-essential cmake flex gawk \
            git gperf help2man libncurses-dev libtool libtool-bin libusb-1.0-0 \
            python3 python3-venv rsync texinfo unzip wget

      - name: Disk space
        run: df -h / /mnt

      - name: Build toolchain + kernel + rootfs + wifi firmware
        env:
          WORK: /mnt/esp32-build
        run: |
          sudo mkdir -p "$WORK" && sudo chown -R "$USER":"$USER" "$WORK"
          bash ci-build.sh

      - name: Upload dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-linux-16m8r-dist
          path: dist/
          if-no-files-found: warn

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/
          if-no-files-found: ignore
